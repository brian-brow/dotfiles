# ---- palette (templater fills these in) ----
set -g @c_surface "#111318"
set -g @c_inverse_surface "#e1e2e9"
set -g @c_primary "#a8c8ff"
set -g @c_tertiary "#dbbce1"
set -g @c_outline_variant "#43474e"

# ---- keybinds / behavior ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind r
bind-key -T prefix r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"

unbind '"'
unbind %
bind -n M-| split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

bind -n M-c new-window -c "#{pane_current_path}"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-Left  resize-pane -L 2
bind -n M-Right resize-pane -R 2
bind -n M-Up    resize-pane -U 2
bind -n M-Down  resize-pane -D 2

bind -n M-x confirm-before -p "Kill pane #P? (y/n)" kill-pane

set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
setw -g mode-keys vi
set -g status-position bottom

# ---- pane borders ----
setw -g pane-border-lines heavy
setw -g pane-border-indicators colour
setw -g pane-border-style "fg=#{@c_outline_variant}"
setw -g pane-active-border-style "#{?pane_in_mode,fg=#{@c_tertiary},#{?synchronize-panes,fg=red,fg=#{@c_primary}}}"

setw -g pane-border-format ""
# setw -g pane-border-format " #P: #{pane_current_command} "

# border line only when the window has more than one pane
setw -g pane-border-status off
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
set-hook -g after-new-window      'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'

# ---- status bar ----
set -g status-style "bg=#{@c_surface},fg=#{@c_inverse_surface}"

set -g status-left "#[fg=#{@c_primary}] #S "
set -g status-right "#[fg=#{@c_tertiary}] %H:%M #[fg=#{@c_primary}] %d-%m-%Y "

# ---- windows ----
setw -g window-status-current-style "fg=#{@c_surface},bg=#{@c_primary},bold"
setw -g window-status-current-format " #I #W "

setw -g window-status-style "fg=#{@c_inverse_surface}"
setw -g window-status-format " #I #W "

set -g status-left-length 20
set -g status-right-length 40
