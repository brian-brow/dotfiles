onboarding = false
# herdr config — ported from ~/.config/tmux/tmux.conf
#
# GENERATED BY MATUGEN. Do not edit ~/.config/herdr/config.toml directly.
# Source: ~/.config/matugen/templates/herdr.toml

[keys]
prefix = "ctrl+a"

reload_config = "prefix+r"
resize_mode = "alt+r"        # moved off its prefix+r default to free it for reload

split_vertical = "alt+|"     # side by side
split_horizontal = "alt+minus"  # stacked

new_tab = "alt+c"
switch_tab = "alt+1..9"
close_pane = "alt+x"

focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

workspace_picker = "alt+w"

next_workspace = "alt+tab"   # ctrl+tab does not register, do not switch back
previous_workspace = "alt+shift+tab"

# Navigate mode (prefix+g) only — separate from focus_pane_* above.
# Swapped from herdr defaults: vim keys walk spaces, arrows walk panes.
# h/l unbound: spaces are a vertical list. left/right arrows are reserved to panes.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

# No directional resize action exists; resize_mode is the only built-in.
# Untested alternative:
# [[keys.command]]
# key = "alt+left"
# type = "shell"
# command = "herdr pane resize --pane \"$HERDR_ACTIVE_PANE_ID\" --direction left --amount 0.02"

[terminal]
new_cwd = "follow"           # new panes/tabs inherit the current pane's cwd

[ui]
prompt_new_tab_name = false  # create tabs immediately, as tmux did
mouse_capture = true
pane_borders = true
show_agent_labels_on_pane_borders = true
tab_bar_position = "bottom"

# ---- theme ----
# Base theme supplies only the status hues left uncommented below
# (green/yellow/peach); every structural color is overridden by matugen.
[theme]
name = "catppuccin"
auto_switch = false

# Material You palette, mapped to herdr's 16 custom tokens.
# Mirrors ~/.config/matugen/templates/tmux.conf:
#   surface        -> bar background      (tmux status-style bg)
#   inverse_surface-> bar foreground      (tmux status-style fg)
#   primary        -> active accent       (tmux status-left, active window, active border)
#   tertiary       -> secondary accent    (tmux status-right clock, copy-mode border)
#   outline_variant-> pane borders        (tmux pane-border-style)
[theme.custom]
# Surfaces, in ascending elevation. surface_dim matches the ghostty/kitty
# background exactly so panes sit flush in the host terminal; panel_bg lifts
# the tab bar and sidebar one step so the chrome reads as its own layer.
# (Material You sets surface_dim == surface in dark mode, so using it here
# would make the bar invisible against the panes.)
surface_dim = "{{colors.surface.default.hex}}"
panel_bg    = "{{colors.surface_container.default.hex}}"
surface0    = "{{colors.surface_container_high.default.hex}}"
surface1    = "{{colors.surface_container_highest.default.hex}}"

# borders / dividers — overlay0 is the tmux pane-border color
overlay0 = "{{colors.outline_variant.default.hex}}"
overlay1 = "{{colors.outline.default.hex}}"

# foreground
text     = "{{colors.inverse_surface.default.hex}}"
subtext0 = "{{colors.on_surface_variant.default.hex}}"

# accents
accent = "{{colors.primary.default.hex}}"
blue   = "{{colors.primary.default.hex}}"
mauve  = "{{colors.tertiary.default.hex}}"
teal   = "{{colors.secondary.default.hex}}"
red    = "{{colors.error.default.hex}}"

# Agent-status hues. Material You has no green/yellow/orange slot, so these
# fall through to the base theme and stay readable as status signals.
# Uncomment for a fully monochrome, wallpaper-derived bar:
# green  = "{{colors.tertiary.default.hex}}"
# yellow = "{{colors.secondary.default.hex}}"
# peach  = "{{colors.primary_fixed_dim.default.hex}}"
