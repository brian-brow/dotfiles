#output_path = '~/.config/spicetify/Themes/text/color.ini'

[templates.vesktop]
input_path = '~/.config/matugen/templates/midnight-discord.css'
output_path = '~/.config/vesktop/themes/matugen.css'

[templates.ohmyposh]
input_path  = '~/.config/matugen/templates/ohmyposh-safe.json'
output_path = '~/.config/ohmyposh/colors.json'
post_hook = '~/.config/hypr/scripts/ohmyposh.sh'

[templates.todo]
input_path = '~/.config/matugen/templates/todo.css'
output_path = '~/.config/ToDo/style.qss'
post_hook = 'pkill todo-app'
