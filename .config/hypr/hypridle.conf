$screensaver_cmd = /home/brian/.config/hypr/scripts/screensaver.sh

general {
    lock_cmd = hyprlock          # dbus/loginctl lock command
    before_sleep_cmd = loginctl lock-session
    ignore_dbus_inhibit = false  # ignores lock requests from browsers/video players
}

listener {
    timeout = 300                # 5 minutes
    on-timeout = $screensaver_cmd
}

listener {
    timeout = 450                # 7.5 minutes
    on-timeout = hyprlock & sleep 0.3 && pkill -f "kitty --class hypridle-screensaver"
}

listener {
    timeout = 600                # 10 minutes
    on-timeout = systemctl suspend
}
